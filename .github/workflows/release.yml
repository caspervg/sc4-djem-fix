name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH[-PRERELEASE], for example v1.0.0 or v1.0.0-rc.1. Got: $TAG_NAME"
            exit 1
          fi

  release-win32:
    needs: validate-tag
    runs-on: windows-2022
    permissions:
      contents: write
      # For the signed attestations.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Fetch full vcpkg history
        shell: powershell
        run: |
          $isShallow = (git -C vendor/vcpkg rev-parse --is-shallow-repository).Trim()
          if ($isShallow -eq "true") {
            git -C vendor/vcpkg fetch --unshallow
          }

      - name: Bootstrap vcpkg
        shell: powershell
        run: |
          .\vendor\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=${{ github.workspace }}/vendor/vcpkg" >> $env:GITHUB_ENV

      - name: Configure, build, and test
        shell: powershell
        run: |
          cmake --preset vs2022-win32-release -DSC4_ENABLE_PLUGIN_DEPLOYMENT=OFF
          cmake --build --preset vs2022-win32-release-build --parallel
          ctest --test-dir cmake-build-release-visual-studio -C Release --output-on-failure

      - name: Verify DLL output
        shell: powershell
        run: |
          $dlls = @(Get-ChildItem "cmake-build-release-visual-studio/src/dll/Release/*.dll")
          if ($dlls.Count -ne 1) {
            throw "Expected one DLL, found $($dlls.Count)"
          }
          $dll = $dlls[0]
          if ((Get-Item -LiteralPath $dll).Length -le 0) {
            throw "DLL is empty: $dll"
          }
          "DLL_PATH=$($dll.FullName)" >> $env:GITHUB_ENV
          "PROJECT_NAME=$($dll.BaseName)" >> $env:GITHUB_ENV

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: cmake-build-release-visual-studio/src/dll/Release/${{ env.PROJECT_NAME }}.dll
          format: spdx-json
          output-file: ${{ env.PROJECT_NAME }}.spdx.json
          upload-artifact: false

      - name: Package release assets
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $packageDir = Join-Path "${{ github.workspace }}" "release-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item $env:DLL_PATH -Destination $packageDir
          Copy-Item "$($env:PROJECT_NAME).spdx.json" -Destination $packageDir
          Copy-Item "dist/$($env:PROJECT_NAME).ini" -Destination $packageDir
          Copy-Item "README.md" -Destination $packageDir
          Copy-Item "LICENSE.txt" -Destination $packageDir
          Copy-Item "THIRD_PARTY_NOTICES.txt" -Destination $packageDir

          $archivePath = Join-Path "${{ github.workspace }}" ("$($env:PROJECT_NAME)-" + $tag + "-win32.zip")
          if (Test-Path $archivePath) {
            Remove-Item -LiteralPath $archivePath
          }

          Get-FileHash -Algorithm SHA256 (Join-Path $packageDir '*') |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path (Join-Path $packageDir 'SHA256SUMS.txt') -Encoding ascii

          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $archivePath
          "RELEASE_ARCHIVE=$archivePath" >> $env:GITHUB_ENV

      # Build provenance: proves that this workflow built these files from this commit. Check a download
      # with `gh attestation verify <file> --repo <owner>/<repo>`. A private repository cannot attest.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-win32.zip
            cmake-build-release-visual-studio/src/dll/Release/${{ env.PROJECT_NAME }}.dll

      # Links the SBOM to the DLL and the zip.
      - name: Attest SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-win32.zip
            cmake-build-release-visual-studio/src/dll/Release/${{ env.PROJECT_NAME }}.dll
          sbom-path: ${{ env.PROJECT_NAME }}.spdx.json

      - name: Publish GitHub release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag such as v1.0.0-rc.1 becomes a prerelease.
          $prerelease = @()
          if ("${{ github.ref_name }}" -like "*-*") { $prerelease = @("--prerelease") }
          gh release create "${{ github.ref_name }}" "$env:RELEASE_ARCHIVE" "$($env:PROJECT_NAME).spdx.json" `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes @prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

  # Points the sc4pac package at the new release on a branch of caspervg/simtropolis-channel, and
  # links to a prefilled pull request in the job summary.
  sc4pac:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release-win32
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: sc4pac
    concurrency: sc4pac-caspervg-sc4-djem-fix
    steps:
      - uses: caspervg/sc4pac-release-action@af95bc5692cab0a3b32e50aac5b82eb8249ffca9 # v1.0.0
        with:
          channel: sebamarynissen/simtropolis-channel
          asset-id: caspervg-sc4-djem-fix
          asset-name: SC4DjemFix-${{ github.ref_name }}-win32.zip
          token: ${{ secrets.SC4PAC_FORK_TOKEN }}
