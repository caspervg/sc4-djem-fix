[SC4DjemFix]
LogLevel=info
LogToFile=true

; Enable the diagonal jagged edges fix.
Enabled=true

; Clear an internal flip when a cell no longer meets MinHeightDelta.
ClearNonCandidates=true

; Use the rendered diagonal for terrain height queries and prop placement.
MatchHeightQueriesToFlippedCells=true

; Minimum height range among the four cell corners.
MinHeightDelta=12.0

; Keep the current diagonal when the two choices are almost equal.
DiagonalHysteresis=0.05

; Write a log summary after this many additional cell changes.
; 0 disables summaries. 1 writes one after each pass that changes terrain.
; Negative and invalid values use the default of 0.
LogEveryNChanges=0
